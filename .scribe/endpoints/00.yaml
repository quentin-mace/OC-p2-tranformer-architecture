        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      hash:
        custom: []
        name: hash
        description: "The SHA-1 hash of the user's email."
        required: true
        example: abc123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
